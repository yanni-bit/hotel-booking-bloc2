<!--
  ============================================================
  FICHIER     : hotel-detail.html
  COMPOSANT   : HotelDetail
  DESCRIPTION : Template de la page de détail d'un hôtel avec layout
                en deux colonnes (contenu principal 9/12 + widgets 3/12).
                Inclut un fil d'Ariane, le header hôtel avec carrousel,
                un système d'onglets via sidebar et RouterOutlet,
                et des widgets informatifs dans la colonne latérale.
  AUTEUR      : Yannick
  DATE        : 2025
  STRUCTURE   :
    - État de chargement (spinner)
    - État d'erreur (alerte)
    - Contenu principal :
      - Fil d'Ariane (breadcrumb)
      - Colonne principale (9/12) :
        - Header hôtel avec carrousel
        - Sidebar onglets (3/12) + Contenu onglets (9/12)
      - Colonne widgets (3/12) :
        - Carte info hôtel / Why Book / Hôtels populaires / Deal du jour
  ============================================================
-->

<!-- ======================== LOADING ======================== -->
<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">{{ 'common.loading' | translate }}</span>
  </div>
  <p class="mt-3">{{ 'hotel.loadingDetails' | translate }}</p>
</div>

<!-- ======================== ERROR ======================== -->
<div *ngIf="error && !loading" class="alert alert-danger m-4" role="alert">
  {{ error }}
</div>

<!-- ======================== CONTENU PRINCIPAL ======================== -->
<main *ngIf="!loading && !error && hotel" class="pb-5 hotel-detail-page">
  <div class="container">

    <!-- Fil d'Ariane : navigation contextuelle Home > Ville > Hôtel -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a [routerLink]="['/']">{{ 'nav.home' | translate }}</a></li>
        <li class="breadcrumb-item"><a [routerLink]="['/hotels', ville]">{{ ville }}</a></li>
        <li class="breadcrumb-item active" aria-current="page">{{ hotel.nom_hotel }}</li>
      </ol>
    </nav>

    <div class="row">

      <!-- ========================================
           COLONNE PRINCIPALE (9/12)
           Contient le header hôtel et le système d'onglets
           ======================================== -->
      <div class="col-lg-9">

        <!-- Header : carrousel d'images et miniatures -->
        <app-hotel-header [hotel]="hotel"></app-hotel-header>

        <!-- Système d'onglets : sidebar de navigation + contenu dynamique -->
        <div class="row">

          <!-- Sidebar onglets (3/12) + widget aide -->
          <div class="col-md-3 pe-0">
            <app-hotel-sidebar></app-hotel-sidebar>
            <app-help-contact></app-help-contact>
          </div>

          <!-- Contenu des onglets via routes enfants (9/12) -->
          <div class="col-md-9">
            <router-outlet></router-outlet>
          </div>

        </div>
      </div>

      <!-- ========================================
           COLONNE DROITE - WIDGETS (3/12)
           Informations complémentaires et suggestions
           ======================================== -->
      <div class="col-lg-3">
        <!-- Carte résumé de l'hôtel (note, description, tags) -->
        <app-hotel-info-card [hotel]="hotel"></app-hotel-info-card>

        <!-- Avantages de réserver sur le site -->
        <app-why-book></app-why-book>

        <!-- Hôtels populaires dans le même pays -->
        <app-popular-hotels [country]="hotel.pays_hotel" [excludeHotelId]="hotelId"></app-popular-hotels>

        <!-- Offre du jour dans le même pays -->
        <app-deal-of-day [country]="hotel.pays_hotel" [excludeHotelId]="hotelId"></app-deal-of-day>
      </div>

    </div>
  </div>
</main>
