<!--
  ============================================================
  FICHIER     : hotel-header.html
  COMPOSANT   : HotelHeader
  DESCRIPTION : Template de l'en-tête hôtel affichant l'image
                principale et le nom dans une carte Bootstrap.
  AUTEUR      : Yannick
  DATE        : 2025
  STRUCTURE   :
    - Carte Bootstrap avec image principale (400px)
    - Nom de l'hôtel en titre h1
  ============================================================
-->

<!-- En-tête hôtel : image principale + nom -->
<div class="hotel-header mb-4">
  <div class="card border-0 shadow-sm">

    <!-- Image principale de l'hôtel -->
    <img [src]="hotel.img_hotel" [alt]="hotel.nom_hotel" class="card-img-top" style="height: 400px; object-fit: cover;">

    <!-- Nom de l'hôtel -->
    <div class="card-body">
      <h1 class="h3 mb-0">{{ hotel.nom_hotel }}</h1>
    </div>

  </div>
</div>
